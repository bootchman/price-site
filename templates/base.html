{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}InterAlex Price{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">InterAlex Price</a>
    {% if user.is_authenticated %}
      <div class="who">
        <span>{{ user.telegram.full_name|default:user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Выйти</button></form>
      </div>
    {% endif %}
  </header>
  <main class="page">
    {% for message in messages %}<div class="notice notice-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
